name: Main

# The platform's Git integration deploys every push to main by itself, so this
# workflow neither deploys nor migrates — it is the record of whether what
# landed is sound. A red check here means main is broken *and already
# deployed*; the gate that actually holds is the identical check on the pull
# request, before the merge. The chat backend is a Next.js API route
# (app/api/chat/), so it ships with the same Vercel deploy as everything
# else — there is no separate infrastructure for this workflow to deploy.
on:
  push:
    branches: [main]
  # Re-run the checks against the current main without pushing a commit.
  workflow_dispatch: {}

permissions:
  contents: read

# Every commit on main gets its own verdict, so a later push queues rather than
# cancelling the run that was still checking the earlier one.
concurrency:
  group: main
  cancel-in-progress: false

env:
  # Match the Node major the platform builds with; bump here and in
  # pull-request.yml together.
  NODE_VERSION: '22'

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  # Mirrors pull-request.yml's e2e-desktop/e2e-mobile: same two independent
  # jobs, same reasoning (a viewport-specific regression gets its own check;
  # the two run in parallel with `verify`), kept identical so a red check
  # here means something genuinely slipped past the pull request gate rather
  # than the two workflows having quietly drifted apart.
  e2e-desktop:
    name: E2E (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop e2e suite
        run: npm run test:e2e:desktop

      - name: Upload Playwright report (desktop)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop
          path: playwright-report/
          retention-days: 14

  e2e-mobile:
    name: E2E (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile e2e suite
        run: npm run test:e2e:mobile

      - name: Upload Playwright report (mobile)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 14
