name: Main

# The platform's Git integration deploys every push to main by itself, so this
# workflow's `verify` job neither deploys nor migrates — it is the record of
# whether what landed is sound. A red check here means main is broken *and
# already deployed*; the gate that actually holds is the identical check on
# the pull request, before the merge.
#
# The one thing Vercel does not own is the Cloudflare Worker behind the chat
# feature (worker/), so `deploy-worker` deploys that — and only that — after
# the checks above it pass.
on:
  push:
    branches: [main]
  # Re-run the checks against the current main without pushing a commit.
  workflow_dispatch: {}

permissions:
  contents: read

# Every commit on main gets its own verdict, so a later push queues rather than
# cancelling the run that was still checking the earlier one.
concurrency:
  group: main
  cancel-in-progress: false

env:
  # Match the Node major the platform builds with; bump here and in
  # pull-request.yml together.
  NODE_VERSION: '22'

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  deploy-worker:
    name: Deploy chat worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Secrets cannot be read in a job-level `if:`, so the check happens in a
      # step and later steps are conditioned on its output instead. A fork or
      # a fresh clone of this repo has no `CLOUDFLARE_API_TOKEN`, and a missing
      # deploy credential should skip the deploy, not fail a job nobody here
      # can fix.
      - name: Check for deploy credentials
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the chat worker deploy. Set it as a repository secret to enable it."
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pinned rather than `npx wrangler deploy`: this job never runs `npm ci`
      # (deploying doesn't need the website's own dependency tree), so an
      # unpinned version would resolve to whatever is newest on the day it
      # happens to run, rather than a version anyone has verified.
      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.configured == 'true'
        working-directory: worker
        run: npx wrangler@4.129.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
