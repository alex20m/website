name: Pull request

# Nothing here is reviewed by a human before it merges, so this workflow is the
# gate: a pull request is linted, typechecked, tested and built, and only a
# commit that survived all four should be merged.
#
# Nothing in Actions deploys the website. Vercel's own Git integration builds
# its own preview for the pull request — keeping that out of CI is what stops
# a second, racing route to production.
on:
  pull_request:

permissions:
  contents: read

# Superseding a pull request's in-flight run is free — once a new commit is
# pushed, the previous run's result is already stale.
concurrency:
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Match the Node major the platform builds with; bump here and in main.yml
  # together.
  NODE_VERSION: '22'

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` rather than `npm install`: the checks have to run against the
      # exact tree that deploys, not against whatever resolved today.
      - name: Install dependencies
        run: npm ci

      # Each check runs even when an earlier one failed, so one push reports
      # every problem instead of revealing them one round-trip at a time. The
      # job still fails if any of them do.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      # Catches what tsc alone cannot: a route that fails to compile under the
      # Next build, or a page that throws while being prerendered.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  # Two independent jobs — not two projects in one job — so a desktop-only or
  # mobile-only regression shows up as its own red check instead of being
  # buried inside a combined run, and so the two run in parallel with each
  # other and with `verify` rather than queueing behind it. Each drives the
  # same e2e/ spec files against a real Chromium at a different viewport (see
  # playwright.config.ts's `desktop`/`mobile` projects) — this is deliberate:
  # the site is a recruiter-facing single page, and a bug that only shows up
  # at one viewport (the mobile-nav hydration bug this suite was written
  # against, for instance) is exactly what one combined run would risk
  # under-sampling.
  e2e-desktop:
    name: E2E (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Installs a Chromium build matched to the pinned @playwright/test
      # version, plus the OS packages it needs to actually launch headless.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # This single command builds the production bundle, starts it, and runs
      # the suite against it (see playwright.config.ts's `webServer`) — a
      # separate build step would just duplicate `verify`'s.
      - name: Run desktop e2e suite
        run: npm run test:e2e:desktop

      - name: Upload Playwright report (desktop)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-desktop
          path: playwright-report/
          retention-days: 14

  e2e-mobile:
    name: E2E (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile e2e suite
        run: npm run test:e2e:mobile

      - name: Upload Playwright report (mobile)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 14
